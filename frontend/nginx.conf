server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # RQ_012: lotes de sincronización con fotos en base64 (el cliente los parte en ≤ 6 MB; un registro con 5 fotos ronda 7 MB)
  location /api/v1/sincronizacion/ { proxy_pass http://api:5080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 16m; proxy_read_timeout 180s; }
  location /api/ { proxy_pass http://api:5080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 8m; proxy_read_timeout 120s; }
  location /health/ { proxy_pass http://api:5080; }
  location /openapi/ { proxy_pass http://api:5080; }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
